title: 'नामकोश'
title_en: 'Namkosh – Nepali Baby Names'
url: 'https://binitasth.com.np'
lang: ne
timezone: Asia/Kathmandu

# Ad slots stay hidden (no blank gaps) until AdSense is approved.
# After approval set this to true and paste your AdSense code into _includes/ad.html
ads_enabled: false

# Fill these in when ready (empty = tag is not output)
og_image: ''                  # e.g. /assets/og-default.png (1200x630 PNG or JPG)
google_site_verification: ''   # Search Console HTML-tag token
bing_site_verification: ''     # Bing Webmaster token
ga4_id: ''                     # e.g. G-XXXXXXXXXX

# Contact and editor details. Fill these in: they appear on the Contact page,
# in the page footer byline and in the site schema. Leave empty to hide them.
contact_email: ''
github_issues: 'https://github.com/kcbinam52/Baby-names/issues/new'
author_name: ''
author_bio_ne: ''
author_bio_en: ''

# One page per name is built at /name/<slug>/. A name page is kept out of Google
# unless it has its own tip_ne text in the data, or this is set to true.
index_all_names: false

defaults:
  - scope:
      path: ''
      type: 'pages'
    values:
      layout: 'default'
  # The rashi and name-list pages are public and eligible for indexing.

exclude:
  - wrangler.jsonc
  - .assetsignore
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
